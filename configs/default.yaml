# Prova 실행 설정
#
# **여기 있는 키는 전부 코드가 읽는다.** 읽지 않는 키를 남겨 두면 설정 파일이
# 사용자에게 거짓 약속을 한다 — 값을 고쳤는데 아무 일도 일어나지 않는 것이
# 이 프로젝트가 계속 잡아 온 실패 모양과 같다(있는 것과 동작하는 것은 다르다).
#
# 점검에서 실제로 8개가 죽어 있었다. 소비자가 없는 것은 지웠고, 필요한 것은
# 배선했다. 아래 '아직 없는 것' 에 무엇을 왜 안 두는지 적어 둔다.

llm:
  backend: vllm          # vllm | mock
  base_url: http://localhost:8000/v1
  model: Qwen/Qwen2.5-7B-Instruct-AWQ
  timeout: 180

execution:
  headless: true
  viewport: {width: 1280, height: 800}
  step_timeout_ms: 10000
  # 화면이 기대 상태에 도달하기를 기다리는 상한.
  #
  # 실물 웹앱은 제출 결과를 나중에 렌더한다. 기다리지 않으면 렌더 전 DOM 을 보고
  # '기획서가 지정한 에러가 안 뜬다' 로 판정한다 — 올바른 구현이 FAIL 이 되는
  # 오탐이다. 0 이면 기다리지 않는다.
  #
  # 줄이면 테스트가 빨라지지만 오탐 위험이 돌아온다. QA 도구에서 그 교환은
  # 성립하지 않는다 — 느린 것은 참을 수 있고 틀린 것은 참을 수 없다.
  settle_timeout_ms: 2000
  # 스텝마다 스크린샷과 DOM 스냅샷을 남긴다. 끄면 빨라지지만 실패 근거가 없어진다.
  screenshot_every_step: true

grounding:
  # 2차 경로(화면 이미지로 요소 찾기)가 받아들일 최소 신뢰도.
  #
  # VLM 은 못 찾았을 때도 그럴듯한 좌표를 낸다. 이 값보다 낮으면 보정하지 않고
  # 탐지 실패로 남긴다 — 엉뚱한 좌표를 누르고 진행하면 그 뒤 판정이 전부 거짓이 된다.
  vlm_confidence_threshold: 0.5

agent:
  # 케이스당 2차 경로 보정 상한.
  #
  # 라벨 연결이 통째로 깨진 화면에서 모든 스텝이 보정되면, 그 케이스는 '화면을
  # 확인한 것' 이 아니라 '이미지로 조작한 것' 이 된다.
  max_heal: 2

server:
  # 웹 UI 바인딩. 127.0.0.1 을 벗어나면 이 기계의 파일과 브라우저가 남에게 열린다.
  host: 127.0.0.1
  port: 7007

# ---------------------------------------------------------------------------
# 아직 없는 것 (설정 키를 두지 않는다 — 읽지 않는 키는 거짓 약속이다)
# ---------------------------------------------------------------------------
#
#   stages          단계별 백엔드 덮어쓰기(명세서 §10-2). 정량 평가로 배치를
#                   확정한 뒤에 만든다. 지금은 llm.backend 가 S1·S2·S6 을 한꺼번에
#                   바꾼다.
#   grounding.strategies
#                   탐지 전략 우선순위(명세서 §5-1)는 코드에 있다. 순서 자체가
#                   설계 판단이고, hint 에 따라 전략을 끼워 넣는 로직이 있어서
#                   평평한 목록으로 표현되지 않는다. 설정으로 열면 탐지를 깨는
#                   길만 열린다.
#   grounding.timeout_ms
#                   execution.step_timeout_ms 가 그 역할을 한다. 두 개를 두면
#                   어느 것이 이기는지 알 수 없다.
#   grounding.vlm_enabled
#                   `--vlm URL` 이 켜는 것과 주소를 함께 받는다. 켜기만 하고
#                   주소가 없으면 아무것도 못 하므로 플래그를 따로 둘 이유가 없다.
#   llm.max_tokens / llm.temperature
#                   단계마다 필요한 값이 다르다(S1 추출 3072, 제목 다듬기 128).
#                   전역 값을 두면 한 단계에 맞추면 다른 단계가 깨진다.
#   agent.max_retry 일시적 오류 재실행. 구현하지 않았다.
