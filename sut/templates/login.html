<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>로그인</title>
  <style>
    body { font-family: "Malgun Gothic", sans-serif; background:#f4f5f7; margin:0;
           display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .card { background:#fff; padding:36px 40px; border-radius:10px; width:340px;
            box-shadow:0 2px 12px rgba(0,0,0,.08); }
    h1 { font-size:22px; margin:0 0 24px; }
    label { display:block; font-size:13px; color:#444; margin:14px 0 6px; }
    input { width:100%; padding:10px 12px; border:1px solid #ccd0d5; border-radius:6px;
            font-size:14px; box-sizing:border-box; }
    button { width:100%; margin-top:22px; padding:11px; border:0; border-radius:6px;
             background:#2f6fed; color:#fff; font-size:15px; cursor:pointer; }
    .error { margin-top:16px; padding:10px 12px; background:#fdeaea; color:#b32020;
             border-radius:6px; font-size:13px; line-height:1.5; }
  </style>
</head>
<body>
  <div class="card">
    <h1>로그인</h1>

    <!-- action 의 variant 만 다르고, 마크업은 good/bad 가 완전히 동일하다.
         두 실행의 차이가 검증 로직의 유무에서만 나오게 하기 위한 것이다. -->
    <form method="post" action="/{{ variant }}/login" novalidate>
      <label for="email">이메일</label>
      <!-- B4: bad 는 안내 문구가 기획서와 다르다.
           기획서 §2 '안내 문구' 열은 "이메일을 입력하세요" 다.

           안내 문구는 사용자가 가장 먼저 읽는 글자인데, 기획서가 그 열을 적기
           전까지 아무도 확인하지 않았다. S3 는 라벨로 요소를 찾으므로 이 값이
           달라도 탐지는 그대로 된다 — 그래서 조용히 지나갔다. -->
      <input type="text" id="email" name="email"
             placeholder="{{ '아이디를 입력하세요' if variant == 'bad' else '이메일을 입력하세요' }}">

      <label for="password">비밀번호</label>
      <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요">

      <button type="submit">로그인</button>
    </form>

    {% if error %}
      {% if variant == 'slow' %}
      <!-- slow 변형: 서버가 보낸 에러를 브라우저가 늦게 DOM 에 넣는다.
           실물 웹앱의 비동기 렌더링을 한 변수만 바꿔 재현한 것이다 —
           문구도, 마크업도, 검증 로직도 good 과 같고 들어가는 시점만 다르다. -->
      <div id="late-slot"></div>
      <script>
        setTimeout(function () {
          var box = document.createElement("div");
          box.className = "error";
          box.setAttribute("role", "alert");
          box.textContent = {{ error | tojson }};
          document.getElementById("late-slot").appendChild(box);
        }, {{ slow_delay_ms }});
      </script>
      {% else %}
      <div class="error" role="alert">{{ error }}</div>
      {% endif %}
    {% endif %}
  </div>
</body>
</html>
