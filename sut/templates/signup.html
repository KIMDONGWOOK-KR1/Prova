<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>회원가입</title>
  <style>
    body { font-family: "Malgun Gothic", sans-serif; background:#f4f5f7; margin:0;
           display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .card { background:#fff; padding:32px 40px; border-radius:10px; width:340px;
            box-shadow:0 2px 12px rgba(0,0,0,.08); }
    h1 { font-size:22px; margin:0 0 20px; }
    label { display:block; font-size:13px; color:#444; margin:12px 0 6px; }
    input[type=text], input[type=password], select {
            width:100%; padding:10px 12px; border:1px solid #ccd0d5; border-radius:6px;
            font-size:14px; box-sizing:border-box; background:#fff; }
    .check-row { display:flex; align-items:center; gap:8px; margin-top:16px; }
    .check-row label { display:inline; margin:0; }
    .check-row input { width:auto; }
    button { width:100%; margin-top:20px; padding:11px; border:0; border-radius:6px;
             background:#2f6fed; color:#fff; font-size:15px; cursor:pointer; }
    .error { margin-top:16px; padding:10px 12px; background:#fdeaea; color:#b32020;
             border-radius:6px; font-size:13px; line-height:1.5; }
  </style>
</head>
<body>
  <div class="card">
    <h1>회원가입</h1>

    <!-- action 의 variant 만 다르고, 마크업은 good/bad 가 완전히 동일하다.
         두 실행의 차이가 검증 로직의 유무에서만 나오게 하기 위한 것이다.

         닉네임에 maxlength 를 걸지 않는다: 브라우저가 입력을 잘라내면 11자가
         서버에 도달하지 못해 '서버에 최대 길이 검증이 있는가' 를 확인할 수 없다.
         기획서의 규칙은 서버가 강제해야 하는 것이고, Prova 가 보려는 것도 그것이다. -->
    <form method="post" action="/{{ variant }}/signup" novalidate>
      <label for="email">이메일</label>
      <input type="text" id="email" name="email" placeholder="이메일을 입력하세요">

      <label for="password">비밀번호</label>
      <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요">

      <label for="password_confirm">비밀번호 확인</label>
      <input type="password" id="password_confirm" name="password_confirm"
             placeholder="비밀번호를 다시 입력하세요">

      <label for="nickname">닉네임</label>
      <input type="text" id="nickname" name="nickname" placeholder="닉네임을 입력하세요">

      <!-- C4: bad 는 '지인 추천' 항목이 빠져 있다.
           기획서 §2 는 '선택 목록: 검색, 지인 추천, 광고' 를 적어 뒀다.

           이 결함은 화면 단위 케이스로 잡히지 않았다. 기획서의 선택 목록이
           '정상 케이스가 넣을 값을 고르는 데만' 쓰였기 때문이다 — 첫 항목
           '검색' 을 골라 넣고 그것이 있으니 통과했다. 기획서에 적혀 있는데
           아무도 확인하지 않던 항목이다. -->
      <label for="signup_path">가입 경로</label>
      <select id="signup_path" name="signup_path">
        <option value="">선택하세요</option>
        <option value="검색">검색</option>
        {% if variant == 'good' %}<option value="지인 추천">지인 추천</option>{% endif %}
        <option value="광고">광고</option>
      </select>

      <div class="check-row">
        <input type="checkbox" id="agree_terms" name="agree_terms" value="on">
        <label for="agree_terms">약관 동의</label>
      </div>

      <button type="submit">가입하기</button>
    </form>

    {% if error %}
    <div class="error" role="alert">{{ error }}</div>
    {% endif %}
  </div>
</body>
</html>
