<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>비밀번호 변경</title>
  <style>
    body { font-family: "Malgun Gothic", sans-serif; background:#f4f5f7; margin:0;
           display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .card { background:#fff; padding:36px 40px; border-radius:10px; width:380px;
            box-shadow:0 2px 12px rgba(0,0,0,.08); }
    h1 { font-size:22px; margin:0 0 8px; }
    .lead { font-size:13px; color:#666; margin:0 0 22px; line-height:1.6; }
    label { display:block; font-size:13px; color:#444; margin:14px 0 6px; }
    input { width:100%; padding:10px 12px; border:1px solid #ccd0d5; border-radius:6px;
            font-size:14px; box-sizing:border-box; }
    button.icon { width:auto; padding:10px 18px; font-size:18px; }
    button { width:100%; margin-top:22px; padding:11px; border:0; border-radius:6px;
             background:#2f6fed; color:#fff; font-size:15px; cursor:pointer; }
    .error { margin-top:16px; padding:10px 12px; background:#fdeaea; color:#b32020;
             border-radius:6px; font-size:13px; line-height:1.5; }
    .done { margin-top:16px; padding:10px 12px; background:#e9f4ee; color:#1a6b45;
            border-radius:6px; font-size:13px; line-height:1.5; }
  </style>
</head>
<body>
  <div class="card">
    <h1>비밀번호 변경</h1>
    <p class="lead">현재 비밀번호를 확인한 뒤 새 비밀번호로 바꿉니다.</p>

    <!-- 마크업은 good/bad 가 완전히 동일하다. 차이는 서버의 검증 로직뿐이다.
         icons 변형만 접근성 이름을 없앤다 — 재는 변수가 하나여야 한다. -->
    <form method="post" action="/{{ variant }}/change-password" novalidate>
      <label for="current_password">
        {% if variant == 'icons' %}&#128273;{% else %}현재 비밀번호{% endif %}</label>
      <input type="password" id="current_password" name="current_password"
             placeholder="{% if variant != 'icons' %}현재 비밀번호를 입력하세요{% endif %}">

      <label for="new_password">
        {% if variant == 'icons' %}&#128274;{% else %}새 비밀번호{% endif %}</label>
      <input type="password" id="new_password" name="new_password"
             placeholder="{% if variant != 'icons' %}새 비밀번호를 입력하세요{% endif %}">

      <label for="new_password_confirm">
        {% if variant == 'icons' %}&#128275;{% else %}새 비밀번호 확인{% endif %}</label>
      <input type="password" id="new_password_confirm" name="new_password_confirm"
             placeholder="{% if variant != 'icons' %}새 비밀번호를 다시 입력하세요{% endif %}">

      {% if variant == 'icons' %}
      <button type="submit" class="icon">&#10004;</button>
      {% else %}
      <button type="submit">변경하기</button>
      {% endif %}
    </form>

    {% if error %}
    <div class="error" role="alert">{{ error }}</div>
    {% endif %}

    <!-- 완료 안내에 role=alert 를 붙이지 않는다. 붙이면 정상 케이스가 '에러가
         노출됐다' 로 판정된다 — 다른 화면과 같은 이유다. -->
    {% if done %}
    <div class="done">{{ done }}</div>
    {% endif %}
  </div>
</body>
</html>
