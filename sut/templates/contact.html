<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>문의하기</title>
  <style>
    body { font-family: "Malgun Gothic", sans-serif; background:#f4f5f7; margin:0;
           display:flex; align-items:center; justify-content:center; min-height:100vh;
           padding:32px 0; }
    .card { background:#fff; padding:36px 40px; border-radius:10px; width:420px;
            box-shadow:0 2px 12px rgba(0,0,0,.08); }
    h1 { font-size:22px; margin:0 0 8px; }
    .lead { font-size:13px; color:#666; margin:0 0 22px; line-height:1.6; }
    label { display:block; font-size:13px; color:#444; margin:14px 0 6px; }
    input[type=text], select, textarea {
            width:100%; padding:10px 12px; border:1px solid #ccd0d5; border-radius:6px;
            font-size:14px; box-sizing:border-box; font-family:inherit; }
    textarea { min-height:96px; resize:vertical; }
    .check { display:flex; align-items:center; gap:8px; margin-top:16px; }
    .check label { margin:0; }
    button.icon { width:auto; padding:10px 18px; font-size:18px; }
    button { width:100%; margin-top:22px; padding:11px; border:0; border-radius:6px;
             background:#2f6fed; color:#fff; font-size:15px; cursor:pointer; }
    .error { margin-top:16px; padding:10px 12px; background:#fdeaea; color:#b32020;
             border-radius:6px; font-size:13px; line-height:1.5; }
    .done { margin-top:16px; padding:10px 12px; background:#e9f4ee; color:#1a6b45;
            border-radius:6px; font-size:13px; line-height:1.5; }
  </style>
</head>
<body>
  <div class="card">
    <h1>문의하기</h1>
    <p class="lead">문의 유형을 고르고 내용을 남겨 주세요. 답변은 이메일로 보내 드립니다.</p>

    <!-- 마크업은 good/bad 가 완전히 동일하다. 차이는 서버의 검증 로직뿐이다 —
         변수를 하나만 두어야 FAIL 이 '검증 누락' 때문인지 '요소를 못 찾아서'
         인지 구분된다 (다른 화면과 같은 규칙). -->
    <form method="post" action="/{{ variant }}/contact" novalidate>
      <label for="name">{% if variant == 'icons' %}&#128100;{% else %}이름{% endif %}</label>
      <input type="text" id="name" name="name" placeholder="{% if variant != 'icons' %}이름을 입력하세요{% endif %}"
             value="{{ form.name }}">

      <label for="email">{% if variant == 'icons' %}&#9993;{% else %}이메일{% endif %}</label>
      <input type="text" id="email" name="email" placeholder="{% if variant != 'icons' %}답변받을 이메일을 입력하세요{% endif %}"
             value="{{ form.email }}">

      <label for="phone">{% if variant == 'icons' %}&#128222;{% else %}연락처{% endif %}</label>
      <input type="text" id="phone" name="phone" placeholder="{% if variant != 'icons' %}휴대폰 번호를 입력하세요{% endif %}"
             value="{{ form.phone }}">

      <label for="category">{% if variant == 'icons' %}&#127991;{% else %}문의 유형{% endif %}</label>
      <select id="category" name="category">
        <option value="">{% if variant == 'icons' %}&#8212;{% else %}선택하세요{% endif %}</option>
        {% for opt in categories %}
        <option value="{{ opt }}" {% if form.category == opt %}selected{% endif %}>{{ opt }}</option>
        {% endfor %}
      </select>

      <label for="content">{% if variant == 'icons' %}&#128221;{% else %}문의 내용{% endif %}</label>
      <textarea id="content" name="content"
                placeholder="{% if variant != 'icons' %}문의 내용을 10자 이상 입력하세요{% endif %}">{{ form.content }}</textarea>

      <div class="check">
        <input type="checkbox" id="agree_privacy" name="agree_privacy" value="on"
               {% if form.agree_privacy %}checked{% endif %}>
        <label for="agree_privacy">{% if variant == 'icons' %}&#128274;{% else %}개인정보 수집 동의{% endif %}</label>
      </div>

      {# icons 변형은 접근성 이름이 하나도 없다 — 1차 경로의 네 전략이 전부 막힌다. #}
      {% if variant == 'icons' %}
      <button type="submit" class="icon">&#128233;</button>
      {% else %}
      <button type="submit">문의 접수</button>
      {% endif %}
    </form>

    {% if error %}
    <div class="error" role="alert">{{ error }}</div>
    {% endif %}

    <!-- 접수 안내에 role=alert 를 붙이지 않는다. 붙이면 정상 케이스가 '에러가
         노출됐다' 로 판정된다 — 비밀번호 찾기 화면과 같은 이유다. -->
    {% if done %}
    <div class="done">{{ done }}</div>
    {% endif %}
  </div>
</body>
</html>
