<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>방문 예약</title>
  <style>
    body { font-family: "Malgun Gothic", sans-serif; background:#f4f5f7; margin:0;
           display:flex; align-items:center; justify-content:center; min-height:100vh;
           padding:32px 0; }
    .card { background:#fff; padding:36px 40px; border-radius:10px; width:400px;
            box-shadow:0 2px 12px rgba(0,0,0,.08); }
    h1 { font-size:22px; margin:0 0 8px; }
    .lead { font-size:13px; color:#666; margin:0 0 22px; line-height:1.6; }
    label { display:block; font-size:13px; color:#444; margin:14px 0 6px; }
    input, select { width:100%; padding:10px 12px; border:1px solid #ccd0d5;
            border-radius:6px; font-size:14px; box-sizing:border-box; font-family:inherit; }
    button.icon { width:auto; padding:10px 18px; font-size:18px; }
    button { width:100%; margin-top:22px; padding:11px; border:0; border-radius:6px;
             background:#2f6fed; color:#fff; font-size:15px; cursor:pointer; }
    .error { margin-top:16px; padding:10px 12px; background:#fdeaea; color:#b32020;
             border-radius:6px; font-size:13px; line-height:1.5; }
    .done { margin-top:16px; padding:10px 12px; background:#e9f4ee; color:#1a6b45;
            border-radius:6px; font-size:13px; line-height:1.5; }
    /* svgicons 변형이 쓰는 아이콘. 이모지와 달리 '직접 그린 선' 이라 실물 앱에
       가깝다 — 2차 경로가 둘을 똑같이 찾는지 재려고 변형을 나눠 둔다. */
    svg.ic { width:18px; height:18px; stroke:#444; fill:none; stroke-width:1.7;
             stroke-linecap:round; stroke-linejoin:round; vertical-align:middle; }
  </style>
</head>
<body>
  <div class="card">
    <h1>방문 예약</h1>
    <p class="lead">방문하실 날짜와 시간을 골라 주세요.</p>

    <!-- 마크업은 good/bad 가 완전히 동일하다. 아이콘 변형만 접근성 이름을 없앤다.
         icons     = 이모지 (글꼴 안의 그림)
         svgicons  = 인라인 SVG (직접 그린 선 — 실물 앱이 쓰는 모양)
         재는 변수는 '아이콘의 종류' 하나다. -->
    <form method="post" action="/{{ variant }}/booking" novalidate>
      <label for="visitor">
        {%- if variant == 'icons' %}&#128100;
        {%- elif variant == 'svgicons' %}<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
        {%- else %}예약자{% endif %}</label>
      <input type="text" id="visitor" name="visitor"
             placeholder="{% if variant in ('icons', 'svgicons') %}{% else %}예약자 성함{% endif %}"
             value="{{ form.visitor }}">

      <label for="visit_date">
        {%- if variant == 'icons' %}&#128197;
        {%- elif variant == 'svgicons' %}<svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        {%- else %}방문 날짜{% endif %}</label>
      <select id="visit_date" name="visit_date">
        <option value="">{% if variant in ('icons', 'svgicons') %}&#8212;{% else %}선택하세요{% endif %}</option>
        {% for opt in date_options %}
        <option value="{{ opt }}" {% if form.visit_date == opt %}selected{% endif %}>{{ opt }}</option>
        {% endfor %}
      </select>

      <label for="visit_time">
        {%- if variant == 'icons' %}&#128336;
        {%- elif variant == 'svgicons' %}<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        {%- else %}방문 시간{% endif %}</label>
      <select id="visit_time" name="visit_time">
        <option value="">{% if variant in ('icons', 'svgicons') %}&#8212;{% else %}선택하세요{% endif %}</option>
        {% for opt in time_options %}
        <option value="{{ opt }}" {% if form.visit_time == opt %}selected{% endif %}>{{ opt }}</option>
        {% endfor %}
      </select>

      <label for="people">
        {%- if variant == 'icons' %}&#128101;
        {%- elif variant == 'svgicons' %}<svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.4"/><path d="M2 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/><path d="M16 5.5a3.4 3.4 0 0 1 0 6.6M17.5 14c2.7.5 4.5 2.6 4.5 5.4"/></svg>
        {%- else %}인원수{% endif %}</label>
      <input type="text" id="people" name="people"
             placeholder="{% if variant in ('icons', 'svgicons') %}{% else %}1~20{% endif %}"
             value="{{ form.people }}">

      <label for="memo">
        {%- if variant == 'icons' %}&#128221;
        {%- elif variant == 'svgicons' %}<svg class="ic" viewBox="0 0 24 24"><path d="M4 4h12l4 4v12H4z"/><path d="M8 10h8M8 14h8"/></svg>
        {%- else %}요청사항{% endif %}</label>
      <input type="text" id="memo" name="memo"
             placeholder="{% if variant in ('icons', 'svgicons') %}{% else %}남기실 말씀 (선택){% endif %}"
             value="{{ form.memo }}">

      {% if variant == 'icons' %}
      <button type="submit" class="icon">&#128198;</button>
      {% elif variant == 'svgicons' %}
      <button type="submit" class="icon"><svg class="ic" viewBox="0 0 24 24" style="stroke:#fff"><path d="M4 12.5l5 5L20 6.5"/></svg></button>
      {% else %}
      <button type="submit">예약하기</button>
      {% endif %}
    </form>

    {% if error %}
    <div class="error" role="alert">{{ error }}</div>
    {% endif %}

    <!-- 접수 안내에 role=alert 를 붙이지 않는다 — 다른 화면과 같은 이유다. -->
    {% if done %}
    <div class="done">{{ done }}</div>
    {% endif %}
  </div>
</body>
</html>
