<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>상품등록</title>
  <style>
    body { font-family: "Malgun Gothic", sans-serif; background:#f4f5f7; margin:0;
           display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .card { background:#fff; padding:36px 40px; border-radius:10px; width:360px;
            box-shadow:0 2px 12px rgba(0,0,0,.08); }
    h1 { font-size:22px; margin:0 0 24px; }
    label { display:block; font-size:13px; color:#444; margin:14px 0 6px; }
    input { width:100%; padding:10px 12px; border:1px solid #ccd0d5; border-radius:6px;
            font-size:14px; box-sizing:border-box; }
    button { width:100%; margin-top:22px; padding:11px; border:0; border-radius:6px;
             background:#2f6fed; color:#fff; font-size:15px; cursor:pointer; }
    .error { margin-top:16px; padding:10px 12px; background:#fdeaea; color:#b32020;
             border-radius:6px; font-size:13px; line-height:1.5; }
    .sent { margin-top:16px; padding:10px 12px; background:#e9f4ee; color:#1a6b45;
            border-radius:6px; font-size:13px; line-height:1.5; }
  </style>
</head>
<body>
  <div class="card">
    <h1>상품등록</h1>

    <!-- action 의 variant 만 다르고, 마크업은 good/bad 가 완전히 동일하다.
         두 실행의 차이가 검증 로직의 유무에서만 나오게 하기 위한 것이다. -->
    <form method="post" action="/{{ variant }}/product" novalidate>
      <label for="name">상품명</label>
      <input type="text" id="name" name="name" placeholder="상품명을 입력하세요">

      <label for="price">가격</label>
      <input type="text" id="price" name="price" placeholder="숫자만 입력">

      <label for="stock">재고수량</label>
      <input type="text" id="stock" name="stock" placeholder="숫자만 입력">

      <button type="submit">등록하기</button>
    </form>

    {% if error %}
    <div class="error" role="alert">{{ error }}</div>
    {% endif %}

    <!-- 성공 안내에 role=alert 를 붙이지 않는다. 붙이면 정상 케이스가 '에러가
         노출됐다' 로 판정된다 — 비밀번호 찾기의 sent 문구와 같은 이유다. -->
    {% if success %}
    <div class="sent">{{ success }}</div>
    {% endif %}
  </div>
</body>
</html>
