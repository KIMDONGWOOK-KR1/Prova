[project]
name = "prova"
version = "0.1.0"
description = "설계 문서 기반 웹 GUI QA 에이전트 — 기획과 구현의 불일치를 자동으로 찾아낸다"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pdfplumber>=0.11",
    "playwright>=1.48",
    "openai>=1.54",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "reportlab>=4.2",
    "typer>=0.15",
    "python-multipart>=0.0.32",
    "langgraph>=1.2.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[project.scripts]
prova = "prova.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prova"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
